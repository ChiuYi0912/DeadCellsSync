name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: "Build and test (.NET)"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4

      - name: "Setup .NET"
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: "Restore"
        run: dotnet restore DeadCellsSync.sln

      - name: "Build"
        run: dotnet build DeadCellsSync.sln --no-restore --configuration Release

      - name: "Test (offline: no network, no Docker, no Unity)"
        run: dotnet test tests/DeadCellsSync.Core.Tests/DeadCellsSync.Core.Tests.csproj --no-build --configuration Release --logger "console;verbosity=normal"
